<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>projeto-lipai</title>
  </head>
  <body>
    <div id="root"></div>

    <!-- VLibras Widget para Acessibilidade em Libras -->
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>
    <!-- carregado depois da página: se o servidor do VLibras estiver lento, o app não espera por ele -->
    <script>
      window.addEventListener("load", function () {
        var s = document.createElement("script");
        s.src = "https://vlibras.gov.br/app/vlibras-plugin.js";
        s.onload = function () {
          new window.VLibras.Widget("https://vlibras.gov.br/app");
          // o plugin só monta o botão no evento "load" da janela, que já passou
          if (typeof window.onload === "function") window.onload();
        };
        document.body.appendChild(s);
      });
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
